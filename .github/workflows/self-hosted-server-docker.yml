name: Self-Hosted Server Docker

on:
  push:
    branches: [main]
    paths:
      - "mem0/**"
      - "server/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/self-hosted-server-docker.yml"
  pull_request:
    paths:
      - "mem0/**"
      - "server/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/self-hosted-server-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mem
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare compose environment
        run: cp server/.env.ci server/.env

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build self-hosted server image
        run: docker compose -f server/docker-compose.yaml build mem0

      - name: Push self-hosted server image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          source_image="$(docker compose -f server/docker-compose.yaml images -q mem0)"
          sha_tag="sha-${GITHUB_SHA::7}"

          docker tag "$source_image" "$IMAGE:$sha_tag"
          docker push "$IMAGE:$sha_tag"

          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            docker tag "$source_image" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
