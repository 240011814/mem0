name: Self-Hosted Server Docker

on:
  push:
    branches: [main]
    paths:
      - "mem0/**"
      - "server/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/self-hosted-server-docker.yml"

  pull_request:
    paths:
      - "mem0/**"
      - "server/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/self-hosted-server-docker.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mem

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2. Setup Buildx
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # 3. Prepare env (CI config)
      # -------------------------
      - name: Prepare compose environment
        run: cp server/.env.ci server/.env

      # -------------------------
      # 4. Login GHCR (only push)
      # -------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # 5. Compute tags
      # -------------------------
      - name: Set image tags
        id: vars
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # -------------------------
      # 6. Build + Push (核心步骤)
      # -------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ github.ref_name == github.event.repository.default_branch && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # 7. Optional: show image info
      # -------------------------
      - name: Image summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tag: sha-${GITHUB_SHA::7}"