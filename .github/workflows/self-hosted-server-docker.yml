name: Self-Hosted Server Docker

on:
  push:
    branches: [main]
    paths:
      - "mem0/**"
      - "server/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/self-hosted-server-docker.yml"

  pull_request:
    paths:
      - "mem0/**"
      - "server/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/self-hosted-server-docker.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push all-in-one Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2. Set up QEMU (ARM support)
      # -------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -------------------------
      # 3. Set up Buildx
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # 4. Prepare env (CI config)
      # -------------------------
      - name: Prepare compose environment
        run: cp server/.env.ci server/.env

      # -------------------------
      # 5. Login GHCR (only push)
      # -------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # 6. Compute tags
      # -------------------------
      - name: Set image tags
        id: vars
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # -------------------------
      # 7. Build + Push all-in-one image
      #    打包内容: PostgreSQL 16 + Python API + Next.js Dashboard
      #    context: 仓库根目录, dockerfile: server/selfhost.Dockerfile
      # -------------------------
      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/selfhost.Dockerfile

          platforms: linux/amd64,linux/arm64

          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mem0:${{ steps.vars.outputs.sha_tag }}
            ${{ github.ref_name == github.event.repository.default_branch && format('{0}/{1}/mem0:latest', env.REGISTRY, github.repository) || '' }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # 8. Image info
      # -------------------------
      - name: Image summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository }}/mem0"
          echo "Tag: sha-${GITHUB_SHA::7}"
          echo "Dockerfile: server/selfhost.Dockerfile"
          echo "Platforms: linux/amd64, linux/arm64"
          echo ""
          echo "Bundled services:"
          echo "  - PostgreSQL 16 (port 5432)"
          echo "  - mem0 API / uvicorn (port 8000)"
          echo "  - mem0 Dashboard / Next.js (port 3000)"