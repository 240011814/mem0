[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mem0-api]
command=sh -c "while ! pg_isready -h 127.0.0.1 -U postgres -q; do sleep 1; done && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
directory=/app
autostart=true
autorestart=true
priority=10
environment=POSTGRES_HOST="127.0.0.1",PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",PYTHONPATH=""
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mem0-dashboard]
command=node server.js
directory=/app/dashboard
autostart=true
autorestart=true
priority=20
environment=PORT="3000",HOSTNAME="0.0.0.0",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
